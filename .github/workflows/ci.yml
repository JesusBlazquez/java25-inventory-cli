name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # setup-java also writes a Maven toolchains entry, which is what the build asks for.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          mvn-toolchain-id: '25'
          mvn-toolchain-vendor: temurin

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check the jar actually runs
        run: |
          java -jar target/inv.jar add TOO-0001 Hammer tools 12.50 3
          java -jar target/inv.jar receive TOO-0001 10
          java -jar target/inv.jar list
          java -jar target/inv.jar value

      - name: Upload the runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: inv-jar
          path: target/inv.jar
          if-no-files-found: error
